# `tinyflows` capabilities and checkpoints on `tinystoragedrivers` ports.
#
# A crate of its own rather than a feature of the engine: the storage crates
# are git dependencies (OpenHuman vendors them once and `[patch]`es the URL),
# and the published `tinyflows` package cannot carry a git dependency, even an
# optional one. It also keeps the engine's MSRV where it is; this crate needs
# the storage crates' 1.88.
[package]
name = "tinyflows-drivers"
version = "0.1.0"
description = "tinyflows StateStore and graph Checkpointer over tinystoragedrivers document ports"
edition.workspace = true
rust-version = "1.88"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
publish = false

[features]
# `engine` is the run-state store and graph checkpointer, which need the
# `tinyflows` engine. `schedule` (the cron job/run store) needs only
# `tinyflows-schedule`, so a host that runs scheduled jobs but no flows can
# build with `default-features = false, features = ["schedule"]` and pull
# neither the engine nor its expression stack.
default = ["engine"]
engine = ["dep:tinyflows", "dep:async-trait", "dep:sha2", "dep:tokio"]
schedule = ["dep:tinyflows-schedule", "dep:anyhow", "dep:chrono", "dep:uuid"]

[dependencies]
tinystoragedrivers-core = { git = "https://github.com/tinyhumansai/tinystoragedrivers", tag = "v0.4.0" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tinyflows = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tinyflows-schedule = { version = "0.1.0", path = "../tinyflows-schedule", optional = true }
anyhow = { version = "1.0", optional = true }
chrono = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
