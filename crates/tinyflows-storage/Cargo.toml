[package]
name = "tinyflows-storage"
version = "0.1.0"
edition.workspace = true
rust-version = "1.88"
license.workspace = true
repository.workspace = true
publish = false
description = "TinyFlows-owned generic document persistence helpers"

[dependencies]
# These exact git pins bridge the storage security migration while its
# upstream roll-ups are pending. Relative to the published 2.1.2 crates, the
# pin includes the unreleased Storage Bus/QueueStore API (tinystoragedrivers
# PRs #71 and #72) and post-release workspace/lockfile security fixes (#73).
# The consumed API/type crates are otherwise unchanged from 2.1.2.
tinystoragedrivers-api = { git = "https://github.com/senamakel/tinystoragedrivers", version = "2.1.2", rev = "2d23a6a6009fa52d1e7aa18de589bdd109a54b6a" }
tinystoragedrivers-types = { git = "https://github.com/senamakel/tinystoragedrivers", version = "2.1.2", rev = "2d23a6a6009fa52d1e7aa18de589bdd109a54b6a" }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
sha2 = "0.11"
ulid = "1"
data-encoding = "2"

[dev-dependencies]
tinystoragedrivers-testkit = { git = "https://github.com/senamakel/tinystoragedrivers", version = "2.1.2", rev = "2d23a6a6009fa52d1e7aa18de589bdd109a54b6a" }
tinystoragedrivers-busproxy = { git = "https://github.com/senamakel/tinystoragedrivers", version = "2.1.2", rev = "2d23a6a6009fa52d1e7aa18de589bdd109a54b6a" }
tinybus-sdk = { package = "tinybus", git = "https://github.com/senamakel/tinybus", rev = "0de2d283f35cbbff08efad6fbe05537ffb74611b", default-features = false }
