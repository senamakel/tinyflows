[package]
name = "tinyflows-module"
version = "0.1.0"
edition.workspace = true
rust-version = "1.88"
license.workspace = true
repository.workspace = true
publish = false
description = "Loadable TinyBus module for workflow authoring and scheduling"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
tinyflows-drivers = { path = "../tinyflows-drivers", default-features = false, features = ["catalog", "engine", "schedule"] }
tinyflows-catalog = { path = "../tinyflows-catalog" }
tinyflows-import = { path = "../tinyflows-import", default-features = false, features = ["flow-write"] }
tinystoragedrivers-core = { git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "be94f7568fe7650b0729be55128f48270414b9a7" }
tinyflows-schedule = { path = "../tinyflows-schedule" }
anyhow = "1"
chrono.workspace = true
async-trait.workspace = true
serde.workspace = true
tokio.workspace = true
uuid.workspace = true
tracing.workspace = true
tinyflows = { workspace = true, features = ["mock"] }
tinyflows-bus = { path = "../tinyflows-bus" }
tinyflows-copilot = { path = "../tinyflows-copilot" }
tinytools = { git = "https://github.com/tinyhumansai/tinytools", rev = "643df90ba25f93187249fa99f6789f9aa7f8bbc8" }
tinybus = { version = ">=0.3.12, <0.4", default-features = false, features = ["macros", "modules"] }
tinybus-module = ">=0.3.12, <0.4"
serde_json.workspace = true

[features]
default = []
# Swap the C ABI exports for a Rust `linked_module()` so a host can link the
# module into its own executable (several linked modules can then coexist).
static-link = []

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
